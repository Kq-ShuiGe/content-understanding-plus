[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-understanding-plus"
version = "3.1.0"
description = "B绔欒棰戝唴瀹圭悊瑙ｏ細瀹樻柟AI鎬荤粨 鈫?CC瀛楀箷 鈫?鏈湴杞啓锛屼笁璺厹搴曪紝杈撳嚭浜鸿瘽鎬荤粨銆侻aiBot / OneBot / NoneBot2 閫氱敤"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kq-ShuiGe" }]
keywords = ["bilibili", "qqbot", "maibot", "nonebot", "onebot", "whisper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "bilibili-api-python>=17.4.0",
]

[project.optional-dependencies]
nonebot = ["nonebot2>=2.2.0", "nonebot-adapter-onebot>=2.4.0"]
sidecar = ["websockets>=12.0"]
asr = ["faster-whisper>=1.0.0", "numpy>=1.24"]
all = [
    "websockets>=12.0",
    "nonebot2>=2.2.0",
    "nonebot-adapter-onebot>=2.4.0",
    "faster-whisper>=1.0.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Kq-ShuiGe/content-understanding-plus"

[tool.setuptools]
py-modules = ["cu_core"]
packages = ["nonebot_plugin_bilivideo"]
